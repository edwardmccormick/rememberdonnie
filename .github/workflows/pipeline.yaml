---
name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: API tests and bundle
        working-directory: api
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run package

      - name: Check site files
        run: node scripts/check-site.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Lint CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint infrastructure/*.yaml

  # Runs once the deploy role exists and these repository variables are set:
  # AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, DISTRIBUTION_ID
  # (see infrastructure/github-deploy-role-cloudformation.yaml).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      API_FUNCTION: rememberdonnie-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy
        run: bash scripts/deploy.sh
